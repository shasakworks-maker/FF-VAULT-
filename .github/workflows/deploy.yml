name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Triggers on push to either main or master

permissions:
  contents: write # Required to allow writing/deploying to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The directory that Vite builds to
          branch: gh-pages # The target branch for GitHub Pages
          clean: true # Keep old commits clean
